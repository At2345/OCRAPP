services:
  - type: web
    name: handwriting-ocr-digitizer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CONFIDENCE_THRESHOLD
        value: "0.80"
      - key: MAX_FILE_SIZE_MB
        value: "15"
      - key: DATABASE_PATH
        value: /tmp/ocr_uploads.sqlite3
