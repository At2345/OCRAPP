services:
  - type: web
    name: handwriting-ocr-digitizer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: OCR_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CONFIDENCE_THRESHOLD
        value: "0.80"
      - key: MAX_FILE_SIZE_MB
        value: "15"
      - key: DATABASE_PATH
        value: /tmp/ocr_uploads.sqlite3
